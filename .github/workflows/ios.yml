name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/FamilyApp.Maui
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install matching MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.300.3
      - name: Build for simulator
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            simulator_rid=iossimulator-arm64
          else
            simulator_rid=iossimulator-x64
          fi
          dotnet build FamilyApp.Maui.csproj -c Release -p:RuntimeIdentifier="$simulator_rid"
