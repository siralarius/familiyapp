name: CI

on:
  push:
    branches: [main, feature/bootstrap-family-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Google Calendar configuration and read-only OAuth
        run: node --test scripts/google-calendar.test.mjs
      - name: Restore
        run: dotnet restore FamilyApp.slnx
      - name: Build
        run: dotnet build FamilyApp.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test FamilyApp.slnx --no-build --configuration Release
      - name: Publish browser preview
        run: dotnet publish src/FamilyApp.Web/FamilyApp.Web.csproj --no-build --configuration Release -o publish
