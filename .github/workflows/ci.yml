name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FamilyApp.slnx
      - run: dotnet build FamilyApp.slnx --no-restore --configuration Release
      - run: dotnet test FamilyApp.slnx --no-build --configuration Release
