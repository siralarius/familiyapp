name: .NET CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FamilyApp.slnx
      - name: Build
        run: dotnet build FamilyApp.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test FamilyApp.slnx --no-build --configuration Release
